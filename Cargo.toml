[package]
name = "vibefuse"
version = "1.0.3"
edition = "2024"
rust-version = "1.89"
description = "Control panel for the Arturia MiniFuse 1 audio interface"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["audio", "arturia", "minifuse", "mixer"]
categories = ["multimedia::audio"]
publish = false

[dependencies]
# macOS draws with Skia on Metal (Apple has deprecated OpenGL), which falls
# back to drawing in software by itself. Windows uses FemtoVG on OpenGL, as
# cheap there, with Slint's software renderer as the fallback; the build
# also stays one file without the Visual C++ runtime that Skia needs.
# `system-tray` brings Slint's own tray icon (AppKit, Shell_NotifyIcon).
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "accessibility", "system-tray"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
sys-locale = "0.3"
# Effects: VST3's COM bindings (MIT since VST 3.8), plug-in libraries, and
# parameter changes on their way to the audio thread without a lock.
vst3 = "0.3"
libloading = "0.9"
rtrb = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["renderer-skia", "unstable-winit-030"] }
objc2 = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
slint = { version = "1.18", default-features = false, features = ["renderer-femtovg", "renderer-software", "software-renderer-systemfonts", "software-renderer-path"] }

[target.'cfg(not(windows))'.dependencies]
rusb = { version = "0.9", features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.18"

# Local release builds compile in parallel. The packages use `dist`, which
# takes longer for a smaller and faster program.
[profile.release]
strip = true

# Dependencies are built once: one unit each is less work in all.
[profile.release.package."*"]
codegen-units = 1

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# Line numbers are all tests and debug builds need from debug info: much
# less to write and link than the full information.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
