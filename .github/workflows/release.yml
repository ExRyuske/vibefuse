# Raises the version, commits and tags it, builds the macOS and Windows
# packages and publishes them on the Releases page. Runs by itself
# once CI passes on main, as the next patch version, when the program has
# changed since the last release. By hand (Actions → Release → Run workflow)
# for a minor or major version, or "none" to release the current one.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to raise
        type: choice
        options: [patch, minor, major, none]
        default: patch

permissions:
  contents: write

concurrency: release

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      release: ${{ steps.changes.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # After a push: only when CI passed on what main is now (a newer push
      # gets its own run) and the program changed since the last release.
      - name: Anything to release
        id: changes
        run: |
          release=true
          if [ "${{ github.event_name }}" = workflow_run ]; then
            last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            if [ "$(git rev-parse HEAD)" != "${{ github.event.workflow_run.head_sha }}" ]; then
              echo "main has moved on since this CI run"
              release=false
            elif [ -n "$last" ] && git diff --quiet "$last" HEAD -- src ui driver assets translations packaging build.rs Cargo.toml Cargo.lock; then
              echo "The program has not changed since $last"
              release=false
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.release == 'true'
      - name: Raise the version
        id: bump
        if: steps.changes.outputs.release == 'true'
        run: |
          current=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.bump || 'patch' }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            none) ;;
          esac
          version="$major.$minor.$patch"
          if [ "$version" != "$current" ]; then
            sed -i "0,/^version = \".*\"/s//version = \"$version\"/" Cargo.toml
            cargo update --workspace
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        if: steps.changes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.bump.outputs.version }}
          if gh release view "v$version" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "v$version is released already: pick another part to raise" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "Release $version"
          git push origin "HEAD:${{ github.ref_name }}"
          # A tag without a release is left over from a failed run: it moves
          # to this commit, so a fixed retry builds the fix.
          git tag --force "v$version"
          git push --force origin "refs/tags/v$version"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: UNIVERSAL=1 sh scripts/package.sh
            targets: aarch64-apple-darwin, x86_64-apple-darwin
          - os: windows-latest
            package: sh scripts/package.sh
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - name: Package
        shell: bash
        run: ${{ matrix.package }}
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ runner.os }}
          path: |
            target/dist/VibeFuse-*.dmg
            target/dist/VibeFuse-*.exe
            target/dist/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ needs.version.outputs.version }}
          gh release create "v$version" dist/* \
            --repo "${{ github.repository }}" \
            --title "VibeFuse $version" \
            --generate-notes
